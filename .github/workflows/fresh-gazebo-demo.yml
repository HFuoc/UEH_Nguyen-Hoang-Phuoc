name: Fresh Gazebo V12 Recovery

on:
  push:
    branches:
      - sandbox-gazebo-demo-20261001

permissions:
  contents: read

jobs:
  gazebo-v12:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Astra v12 plus bounded missing-lane recovery
        shell: bash
        run: |
          set -euo pipefail
          cat ci_patch/part* | base64 -d > /tmp/current_patch.tgz
          echo "183e8f40ada5c9e1e7f218745c30da03d85c49969d9d4a2ee03a62a0d8b9a11a  /tmp/current_patch.tgz" | sha256sum -c -
          tar -xzf /tmp/current_patch.tgz -C "$GITHUB_WORKSPACE"
          python3 ci_patch/apply_freshness.py
          python3 -m py_compile src/crc_solution/crc_solution/freshness.py src/crc_solution/crc_solution/control.py src/crc_solution/crc_solution/node.py
          python3 tools/check_rules.py

      - name: Build Docker image and ROS 2 workspace
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_docker.sh build
          bash scripts/run_docker.sh compile

      - name: Start fresh headless Gazebo
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_docker.sh up-headless
          for i in $(seq 1 40); do
            if docker exec crc bash -lc 'source /opt/ros/humble/setup.bash && source /ws_build/install/setup.bash && timeout 2 ros2 topic echo /odom --once >/dev/null 2>&1'; then
              break
            fi
            sleep 2
          done
          docker exec crc bash -lc 'source /opt/ros/humble/setup.bash && source /ws_build/install/setup.bash && python3 /ws/scripts/verify_sensors.py'

      - name: Run fresh 300-second evaluation
        shell: bash
        run: |
          set -euo pipefail
          docker exec crc bash -lc 'rm -rf /tmp/crc_results /tmp/crc-driver.log /tmp/crc-node-info.txt'
          docker exec crc bash -lc 'source /opt/ros/humble/setup.bash && source /ws_build/install/setup.bash && bash /ws/scripts/evaluate.sh 300'
          mkdir -p fresh_results
          docker cp crc:/tmp/crc_results fresh_results/crc_results
          docker cp crc:/tmp/crc-driver.log fresh_results/driver.log || true
          docker cp crc:/tmp/crc-node-info.txt fresh_results/node-info.txt || true
          docker logs crc > fresh_results/simulator.log 2>&1 || true

      - name: Summarize fresh run
        if: always()
        shell: bash
        run: |
          set -u
          t="$(find fresh_results -name telemetry.csv -type f 2>/dev/null | sort | tail -1 || true)"
          if [ -n "$t" ]; then
            python3 - "$t" <<'PY'
          import csv,sys,math
          rows=list(csv.DictReader(open(sys.argv[1],newline='',encoding='utf-8')))
          good=[]
          for r in rows:
              try:
                  d=float(r.get('distance_odom_m') or 0)
                  t=float(r.get('sim_time') or 0)
              except Exception:
                  continue
              good.append((t,d,r))
          print('rows:',len(good))
          if good:
              best=max(good,key=lambda z:z[1])
              last=good[-1]
              print('max_distance_m:',best[1])
              print('last_distance_m:',last[1])
              print('last_state:',last[2].get('state'))
              print('last_lane_confidence:',last[2].get('lane_confidence'))
              print('last_front_m:',last[2].get('front_m'))
              seq=[]
              for _,_,r in good:
                  s=r.get('state','')
                  if s and (not seq or seq[-1]!=s):
                      seq.append(s)
              print('compressed_states:',' -> '.join(seq))
              print('LANE_RECOVERY rows:',sum(r.get('state')=='LANE_RECOVERY' for _,_,r in good))
          PY
          else
            echo "No telemetry produced."
          fi

      - name: Render demo from this fresh run only
        if: always()
        shell: bash
        run: |
          set -u
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          find fresh_results -type f -name '*.jpg' ! -name '*_camera.jpg' 2>/dev/null | sort > /tmp/frames.txt || true
          if [ -s /tmp/frames.txt ]; then
            : > /tmp/concat.txt
            while IFS= read -r f; do
              printf "file '%s/%s'\n" "$GITHUB_WORKSPACE" "$f" >> /tmp/concat.txt
              printf "duration 0.20\n" >> /tmp/concat.txt
            done < /tmp/frames.txt
            last="$(tail -1 /tmp/frames.txt)"
            printf "file '%s/%s'\n" "$GITHUB_WORKSPACE" "$last" >> /tmp/concat.txt
            ffmpeg -y -hide_banner -loglevel warning -f concat -safe 0 -i /tmp/concat.txt               -vf "scale=960:-2:flags=lanczos,format=yuv420p" -r 15 fresh_gazebo_v12_recovery.mp4
          fi

      - name: Stop simulator
        if: always()
        shell: bash
        run: bash scripts/run_docker.sh down || true

      - name: Upload fresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-gazebo-v12-recovery
          if-no-files-found: warn
          retention-days: 3
          path: |
            fresh_results/
            fresh_gazebo_v12_recovery.mp4
